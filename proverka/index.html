<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест: находят ли вас клиенты онлайн</title>
<meta name="description" content="8 вопросов за 2 минуты: узнайте свой балл и 3 шага, чтобы клиенты находили вас и записывались сами.">
<meta property="og:title" content="Находят ли вас клиенты онлайн? Тест за 2 минуты">
<meta property="og:description" content="8 вопросов, балл от 0 до 100 и 3 шага именно для вас. Бесплатно.">
<meta property="og:url" content="https://vasilenkan72.github.io/portfolio/proverka/">
<meta name="theme-color" content="#0B0B0B">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tools.css?v=6">
<style>
  .progress { height: 2px; background: var(--graphite); border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--coral); width: 0; transition: width .25s; }
  .answers { display: grid; gap: 10px; margin-top: 20px; }
  .answer { text-align: left; background: transparent; color: var(--cloud); font: 400 16px/1.43 var(--font);
            border: 1px solid var(--graphite); border-radius: 10px; padding: 16px 18px; cursor: pointer; }
  .answer:hover { border-color: var(--ash); }
  .answer:focus-visible { outline: none; border-color: var(--coral); }
  .q { font-size: 22px; line-height: 1.35; letter-spacing: -0.01em; }
  .tips { list-style: none; counter-reset: t; margin-top: 16px; }
  .tips li { counter-increment: t; padding: 16px 0 16px 44px; border-top: 1px solid var(--graphite); position: relative; color: var(--stone); }
  .tips li::before { content: counter(t); position: absolute; left: 0; top: 14px; width: 28px; height: 28px; border-radius: 50%;
                     border: 1px solid var(--coral); color: var(--coral); font-size: 14px; display: grid; place-items: center; }
</style>
</head>
<body class="glow">
<main class="wrap">
  <nav class="top"><a href="../" data-t="navHome">Наталья Василенко</a><span class="langs" id="langs"></span><a href="../cena/" id="navCalc" data-t="navCalc">Калькулятор цены услуги →</a></nav>

  <header id="intro">
    <p class="eyebrow" data-t="eyebrow">Тест · 8 вопросов · 2 минуты</p>
    <h1 data-t="h1">Находят ли вас клиенты онлайн?</h1>
    <p class="lead" data-t="lead"></p>
    <div class="actions"><button class="btn" id="go" data-t="go">Начать тест</button></div>
  </header>

  <section class="panel hidden" id="quiz">
    <div class="progress"><i id="bar"></i></div>
    <p class="eyebrow" id="step"></p>
    <p class="q" id="question" style="margin-top:12px"></p>
    <div class="answers" id="answers"></div>
    <div class="actions"><button class="ghost hidden" id="back" data-t="back">← Назад</button></div>
  </section>

  <section class="hidden" id="result" aria-live="polite">
    <div class="panel">
      <p class="eyebrow" data-t="yourResult">Ваш результат</p>
      <p class="big"><span id="score">0</span><span style="color:var(--ash);font-size:.45em"> / 100</span></p>
      <h2 id="level" style="margin:12px 0 4px"></h2>
      <p style="color:var(--ash)" id="levelText"></p>
    </div>
    <div class="panel">
      <h2 id="tipsTitle"></h2>
      <ol class="tips" id="tips"></ol>
    </div>
    <div class="panel bridge">
      <p class="eyebrow" data-t="calcEyebrow"></p>
      <h2 data-t="calcH"></h2>
      <p data-t="calcP"></p>
      <div class="actions"><a class="btn" id="calcBtn" href="../cena/" data-t="calcBtn"></a></div>
    </div>
    <section class="offer">
      <h2 data-t="offerH"></h2>
      <p data-t="offerP"></p>
      <p id="offerLead"></p>
      <ul class="prices" id="prices"></ul>
      <div class="actions">
        <a class="btn" id="cta" data-t="cta" href="https://t.me/natallia_assistant_bot?start=quiz"></a>
        <button type="button" class="ghost" id="share" data-t="share"></button>
        <button type="button" class="ghost" id="again" data-t="again"></button>
      </div>
      <p class="note hidden" id="copied" data-t="copied"></p>
    </section>
    <p class="note" data-t="privacy"></p>
  </section>

  <footer class="foot"><span data-t="foot"></span> · <a href="https://t.me/natallia_vasilenka">@natallia_vasilenka</a></footer>
</main>
<script type="module" src="app.js?v=6"></script>
</body>
</html>
